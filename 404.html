/* ── Sistema de diseño v3 (mismo que index.html) ── */
:root {
  --color-primary:   #4B02F3;  /* Violeta eléctrico: botones, enlaces e íconos */
  --color-secondary: #490FCD;  /* Violeta profundo: hover */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px 20px;font-family:var(--body);font-size:16px;line-height:1.6;color:var(--color-text);background:radial-gradient(60% 45% at 50% 0%,rgba(var(--color-primary-rgb),.08) 0%,transparent 70%),radial-gradient(45% 45% at 100% 100%,rgba(var(--color-lavender-rgb),.2) 0%,transparent 70%),var(--color-paper);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}

.brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:30px;text-decoration:none}
.brand img{width:36px;height:36px;border-radius:22%}
.wordmark{font-family:var(--display);font-size:1.12rem;font-weight:700;letter-spacing:.1em;color:var(--color-ink)}

.status .ico{width:34px;height:34px;stroke-width:2}
.kicker{margin-bottom:10px;font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--color-primary)}
.title{margin-bottom:12px;font-family:var(--display);font-size:clamp(2rem,6vw,2.6rem);font-weight:600;line-height:1.08;letter-spacing:-.01em;color:var(--color-ink);text-wrap:balance}
.title em{font-style:italic;color:var(--color-primary)}
.subtitle{max-width:440px;margin:0 auto 28px;font-size:1rem;line-height:1.7;color:var(--color-text-muted);text-wrap:pretty}
.subtitle strong{font-weight:600;color:var(--color-ink)}
.steps{display:grid;gap:10px;margin-bottom:28px;text-align:left;list-style:none}
.step{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--color-paper);border:1px solid var(--color-border)}
.step-ico{width:38px;height:38px;flex-shrink:0;display:grid;place-items:center;border-radius:11px;background:var(--color-white);border:1px solid var(--color-border);color:var(--color-primary)}
.step h2{margin-bottom:2px;font-size:.95rem;font-weight:600;line-height:1.4;color:var(--color-ink)}
.step p{font-size:.87rem;line-height:1.55;color:var(--color-text-muted)}
.divider{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.dline{flex:1;height:1px;background:var(--color-border)}
.dtxt{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:var(--color-text-muted)}
.btn-group{display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:12px 24px;border-radius:999px;border:1.5px solid transparent;font-family:var(--body);font-size:.92rem;font-weight:600;line-height:1.2;text-decoration:none;cursor:pointer;transition:background-color var(--tr),border-color var(--tr),color var(--tr),box-shadow var(--tr),transform var(--tr)}
.btn .ico{width:18px;height:18px}
.btn-primary{background:var(--color-primary);color:var(--color-white);box-shadow:0 1px 2px rgba(var(--color-primary-rgb),.18),0 10px 22px -10px rgba(var(--color-primary-rgb),.6)}
.btn-primary:hover{background:var(--color-secondary);transform:translateY(-1px)}
.btn-ghost{background:var(--color-white);color:var(--color-ink);border-color:rgba(var(--color-ink-rgb),.16)}
.btn-ghost:hover{color:var(--color-primary);border-color:var(--color-primary)}
.btn-text{min-height:44px;background:none;color:var(--color-text-muted);font-weight:500}
.btn-text:hover{color:var(--color-primary)}
.footer-note{position:relative;z-index:1;font-size:.82rem;line-height:1.6;text-align:center;color:var(--color-text-muted)}
.footer-note a{color:var(--color-primary);text-decoration:none}
.footer-note a:hover{color:var(--color-primary);text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:3px}
::selection{background:rgba(var(--color-primary-rgb),.16);color:var(--color-ink)}
@media (max-width:560px){
  body{padding:28px 16px}

@media (prefers-reduced-motion:reduce){

.code{margin-bottom:6px;font-family:var(--display);font-size:clamp(4.2rem,14vw,5.6rem);font-weight:600;line-height:1;letter-spacing:-.02em;color:var(--color-primary);font-variant-numeric:lining-nums}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.links .btn{flex:1 1 180px}
.btn-group{margin-bottom:12px}
</style>
